# T1S: 8 GB GPU Tier (e.g., RTX 3070, RTX 4060, RTX 2070 Super)
generation:
  primary_model: "wan22-5b-gguf-q4"
  video_primary: "wan22-5b-gguf-q4"
  video_fallback: "parallax"
  fallback_models:
    - "parallax"
    - "kenburns"
  max_retries: 1
  max_clip_duration_s: 3.0
  max_i2v_clip_s: 3.0
  max_i2v_panels: 2
  max_i2v_takes: 1
  calibration_file: "configs/calibration/t1s.yaml"

understanding:
  vlm: "qwen3-vl-8b-4bit"

cost:
  i2v_budget_s: 120.0

qc:
  identity_threshold: 0.85
  flicker_threshold: 0.15
  max_new_text_lines: 0
  require_text_check: true
  per_route:
    i2v:
      min_identity_similarity: 0.72
      max_flicker_score: 0.15
      min_motion_score: 0.01
      max_motion_score: 0.98
      max_warp_error: 0.12
      min_first_frame_fidelity: 0.75
      max_style_drift: 0.28
      max_retries: 1
    parallax:
      min_identity_similarity: 0.85
      max_flicker_score: 0.15
      min_motion_score: 0.01
      max_motion_score: 0.98
      max_warp_error: 0.10
      min_first_frame_fidelity: 0.82
      max_style_drift: 0.20
      max_retries: 1
    kenburns:
      min_identity_similarity: 0.85
      max_flicker_score: 0.15
      min_motion_score: 0.01
      max_motion_score: 0.98
      max_warp_error: 0.10
      min_first_frame_fidelity: 0.85
      max_style_drift: 0.18
      max_retries: 0
