# M2A 18-Genre Theme & Context Profiles (Schema v2)
default_genre: shonen
aliases:
  violence: seinen
  violence_action: action_adventure
  action: action_adventure
  romance: romance_drama
  horror: horror_thriller
  dark_mystery_horror: horror_thriller
  epic_awakening: isekai
  comedy: comedy_slice_of_life
  slice_of_life: comedy_slice_of_life
genres:
  shonen:
