    recommended_camera: whip_pan
    transition_type: impact_flash
    vfx_style: speedlines_sparks_aura
    motion_primitives:
    - '[aura_awakening]'
    - '[sword_slash]'
    - '[impact_recoil]'
    bg_prompt: masterpiece anime background, shattered rocky battleground, glowing
      blue energy craters, dramatic storm clouds, ufotable style volumetric lighting
    bg_negative_prompt: photorealistic, 3d render, blurry, watermark, text, speech
      bubble, flat washed out
    relighting:
      color_temperature_kelvin: 5800
      rim_light_rgb:
      - 70
      - 185
      - 255
      bloom_intensity: 0.42
      edge_light_wrap_px: 4
    depth_parallax_scale: 1.25
    audio:
      kokoro_voice: am_adam
      edge_voice: en-US-GuyNeural
      rate: +8%
      pitch: +2Hz
      bgm_style: shonen_taiko_heroic
      dialogue_target_lufs: -14.0
      bgm_active_lufs: -16.0
      ducking_attenuation_db: -11.0
      bgm_ducked_lufs: -27.0
      min_dialogue_to_bgm_snr_db: 11.0
      lookahead_attack_ms: 80
      exponential_release_ms: 320
      sfx_peak_dbfs: -6.0
    default_prior_weight: 1.0
    preferred_layouts:
    - diagonal_action_slash
    - full_bleed_splash
    - vertical_webtoon_scroll
    upstream_datasets:
