panel_layout_topologies:
  vertical_webtoon_scroll:
    gutter_style: vertical_infinite_canvas
    aspect_ratio_range:
    - 0.45
    - 0.65
    recommended_camera: pan_down
  diagonal_action_slash:
    gutter_style: slanted_kinetic_gutter
    aspect_ratio_range:
    - 1.1
    - 1.3
    recommended_camera: whip_pan
  full_bleed_splash:
    gutter_style: full_bleed_edge
    aspect_ratio_range:
    - 0.55
    - 0.75
    recommended_camera: zoom_out
  inset_reaction_overlay:
    gutter_style: overlapping_inset_frame
    aspect_ratio_range:
    - 1.05
    - 1.25
    recommended_camera: zoom_in
  split_screen_standoff:
    gutter_style: parallel_dual_gutter
    aspect_ratio_range:
    - 1.55
    - 1.75
    recommended_camera: pan_right
  shojo_open_flower_borderless:
    gutter_style: borderless_emotional_flow
    aspect_ratio_range:
    - 0.72
    - 0.92
    recommended_camera: zoom_in
  claustrophobic_horror_grid:
    gutter_style: heavy_black_gutter
    aspect_ratio_range:
    - 0.95
    - 1.15
    recommended_camera: zoom_in
  four_koma_gag_strip:
    gutter_style: uniform_4koma_stack
    aspect_ratio_range:
    - 1.3
    - 1.5
    recommended_camera: pan_right
  mecha_hud_cockpit_inset:
    gutter_style: hex_tactical_overlay
    aspect_ratio_range:
    - 1.1
    - 1.3
    recommended_camera: zoom_out
  intimate_two_shot_close:
    gutter_style: soft_vignette_gutter
    aspect_ratio_range:
    - 0.9
    - 1.1
    recommended_camera: zoom_in
storytelling_arc_modes:
  complete_4_act_arc:
    requires_fallback: false
    missing_beats: []
    weaver_strategy: ''
  incomplete_missing_setup:
    requires_fallback: true
    missing_beats:
    - setup
    weaver_strategy: Synthesize prologue establishing hook + character introduction
      bridge panel
  incomplete_missing_climax:
    requires_fallback: true
    missing_beats:
    - climax
    - resolution
    weaver_strategy: Synthesize high-intensity climax bridge panel (Illustrious-XL
      + IP-Adapter) + resolution outro
  incomplete_cliffhanger_ending:
    requires_fallback: true
    missing_beats:
    - resolution
    weaver_strategy: Synthesize dramatic cliffhanger monologue + lingering atmospheric
      outro frame
  fragmented_mid_battle:
    requires_fallback: true
    missing_beats:
    - setup
    - resolution
    weaver_strategy: Wrap raw combat panels with tactical opening narration and aftermath
      impact reveal
  in_medias_res_opening:
    requires_fallback: false
    missing_beats: []
    weaver_strategy: ''
  flashback_memory_montage:
    requires_fallback: false
    missing_beats: []
    weaver_strategy: ''
  parallel_cross_cut:
    requires_fallback: false
    missing_beats: []
    weaver_strategy: ''
