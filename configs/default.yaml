# Manhwa-to-Anime Pipeline — Default Configuration
# Override per compute tier in configs/tiers/

general:
  run_dir: "./runs"
  log_level: "info"

perception:
  detector: "opencv"      # Primary: "opencv" gutter slicing. Alt: "magiv3"
  fallback: "opencv"       # Fallback detector

understanding:
  vlm: "qwen3-vl-8b"
  schema_version: 1

cleanup:
  inpainter: "lama"

generation:
  primary_model: "wan22-ti2v-5b"
  fallback_models:
    - "hunyuan15"
    - "ltx23"
  max_retries: 2
  max_clip_duration_s: 5.0

audio:
  tts_primary: "melotts"    # Korean/multilingual
  tts_fallback: "kokoro"     # Lightweight CPU fallback

composition:
  output_format: "mp4"
  resolution: [720, 1280]    # 9:16 portrait
  fps: 24
  transition_type: "crossfade"

qc:
  identity_threshold: 0.85
  flicker_threshold: 0.15
  max_new_text_lines: 0

# Worker server address (Python AI workers)
worker:
  host: "127.0.0.1"
  port: 8100
