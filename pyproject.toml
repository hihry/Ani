[project]
name = "manhwa2anime"
version = "0.1.0"
description = "Manhwa-to-Anime AI pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "redis",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-image>=0.22",
    "ffmpeg-python",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "rich",
    "typer"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff", "mypy"]
ui = ["streamlit"]
comfyui = ["comfyui-api", "huggingface_hub>=0.23"]
metrics = ["torch>=2.3", "open_clip_torch>=2.24", "lpips>=0.1.4"]

[project.scripts]
m2a = "m2a.cli:app"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
